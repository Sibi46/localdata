{% load static %}<link rel="stylesheet" href="{% static 'css/notifications.css' %}?v=1"><script src="{% static 'js/notifications.js' %}?v=1" defer></script>
{% if request.user.is_authenticated %}<div class="notification-menu" data-notification-menu data-feed-url="{% url 'notification_feed' %}"><button type="button" class="notification-bell" aria-label="Notifications{% if notification_unread_count %}, {{ notification_unread_count }} unread{% endif %}" aria-expanded="false" data-notification-toggle><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z"/><path d="M9 21h6M10 2h4"/></svg><span class="notification-count" data-notification-count {% if not notification_unread_count %}hidden{% endif %}>{% if notification_unread_count > 99 %}99+{% else %}{{ notification_unread_count }}{% endif %}</span></button><section class="notification-panel" data-notification-panel hidden aria-label="Recent notifications"><header><div><p>YOUR LOCAL UPDATES</p><h2>Notifications</h2></div><button type="button" class="notification-close" aria-label="Close notifications" data-notification-close>&times;</button></header><form method="post" action="{% url 'mark_all_notifications_read' %}" data-notification-mark>{% csrf_token %}<span data-notification-summary>{{ notification_unread_count }} unread</span><button type="submit">Mark all as read</button></form><div class="notification-recent" data-notification-items><p class="notification-empty">Loading your updates&hellip;</p></div><a class="notification-view-all" href="{% url 'notifications' %}">View all notifications &rarr;</a></section></div>{% else %}<a class="notification-bell" href="/login/?next=/notifications/" aria-label="Notifications"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z"/><path d="M9 21h6M10 2h4"/></svg></a>{% endif %}

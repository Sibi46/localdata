<dialog class="local-prompt" id="product-limit-dialog" aria-labelledby="product-limit-title"{% if at_limit %} data-auto-open{% endif %}>
  <button type="button" class="local-prompt-close" data-prompt-close aria-label="Close">×</button>
  <span class="local-prompt-icon" aria-hidden="true">☎</span>
  <h2 id="product-limit-title">Need more product slots?</h2>
  <p>Your first 20 products are free. Your current product slots are full.</p>
  <p>Call an admin for more product slots.</p>
  <a class="local-prompt-call" href="tel:+919361240355"><span>Admin · 9361240355</span><strong>☎ Call</strong></a>
  <a class="local-prompt-secondary" href="{% url 'product_access_request' %}">Send a request</a>
  <p class="local-prompt-note">Admin approval is required to increase your allowance.</p>
</dialog>

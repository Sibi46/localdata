{% load static %}<link rel="stylesheet" href="{% static 'css/image-crop.css' %}?v=1"><script src="{% static 'js/image-crop.js' %}?v=1" defer></script>
<dialog class="image-crop-dialog" data-image-crop-dialog aria-labelledby="image-crop-title"><div class="image-crop-content"><header class="image-crop-header"><div><p>MAKE IT FIT</p><h2 id="image-crop-title">Adjust your image</h2></div><button type="button" data-crop-close aria-label="Cancel image crop">×</button></header><p class="image-crop-instructions">Drag the image to position it. Zoom or rotate, then apply your crop.</p><label class="crop-ratio-control" data-crop-ratio-control>Image shape<select data-crop-ratio><option value="1">Square · 1:1</option><option value="0.75">Portrait · 3:4</option><option value="1.3333333333">Landscape · 4:3</option><option value="original">Original shape</option></select></label><div class="image-crop-frame" data-crop-frame><canvas data-crop-canvas tabindex="0" aria-label="Image crop preview. Drag to move, or use the arrow keys to adjust position."></canvas><div class="crop-guide" aria-hidden="true"></div></div><p class="crop-output-note" data-crop-output-note></p><div class="image-crop-zoom"><label for="image-crop-zoom">Zoom</label><input type="range" id="image-crop-zoom" data-crop-zoom min="0.1" max="4" step="0.01" value="1"><output data-crop-zoom-label>100%</output></div><div class="image-crop-tools"><button type="button" data-crop-rotate="-90" aria-label="Rotate image left">↶ Rotate left</button><button type="button" data-crop-rotate="90" aria-label="Rotate image right">↷ Rotate right</button><button type="button" data-crop-fit>Fit image</button><button type="button" data-crop-reset>Reset</button></div><p class="image-crop-error" data-crop-error role="alert" hidden></p><footer class="image-crop-actions"><button type="button" data-crop-cancel>Cancel</button><button type="button" data-crop-apply>Apply crop <span aria-hidden="true">→</span></button></footer></div></dialog>

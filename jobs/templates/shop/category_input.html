<div class="category-picker" data-category-picker>{% include 'django/forms/widgets/text.html' %}<div data-category-enhanced hidden><div class="category-selected" data-category-selected aria-label="Selected categories"></div><select id="{{ widget.attrs.id }}-select" data-category-select aria-label="Choose a category"><option value="">Choose a category</option>{% for category in category_options %}<option value="{{ category }}" data-category-option="{{ category }}">{{ category }}</option>{% endfor %}</select><small data-category-status role="status" aria-live="polite"></small><details class="category-custom"><summary>Add another category</summary><div class="category-add"><input type="text" id="{{ widget.attrs.id }}-custom" data-category-custom maxlength="100" placeholder="Add your own category" aria-label="Add your own category" autocomplete="off"><button type="button" data-category-add>Add tag</button></div></details></div><noscript><small>Enter up to 5 categories separated by commas.</small></noscript></div>

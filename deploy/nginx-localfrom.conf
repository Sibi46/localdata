# Prepared template; not installed or validated by nginx -t in this workspace.
# Issue a certificate covering BOTH names before enabling this HTTPS block.
map $http_upgrade $localfrom_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localfrom.com www.localfrom.com;
    location ^~ /.well-known/acme-challenge/ {
        root /srv/localfrom/acme;
    }
    location / {
        return 308 https://www.localfrom.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name localfrom.com www.localfrom.com;
    ssl_certificate /etc/letsencrypt/live/localfrom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/localfrom.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64m;

    # Historical files must never bypass participant authorization.
    location ^~ /media/chat_files/ { return 404; }
    location ^~ /static/ {
        alias /srv/localfrom/storage/static/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }
    location /media/ {
        alias /srv/localfrom/storage/media/;
        add_header X-Content-Type-Options nosniff always;
        # Uploaded documents must not execute scripts with the site's origin.
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    # Pilot has no approved provider contract. Block payment, paid renewals
    # and video promotion at the public proxy without deleting app routes.
    location ~ ^/advertiser/(payment|renew)/[0-9]+/(success/)?$ {
        default_type text/plain;
        return 503 "Payments are unavailable during the pilot.\n";
    }
    location ~ ^/(ads/[0-9]+/renew|flicks/[0-9]+/advertise)/$ {
        default_type text/plain;
        return 503 "Payments are unavailable during the pilot.\n";
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite untrusted forwarded headers. Daphne is loopback-only.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $localfrom_connection_upgrade;
        proxy_read_timeout 90s;
    }
}

# Include inside the Nginx server block BEFORE enabling public /media/ serving.
# Historical chat uploads remain at their original paths for data preservation.
# They must only be served by /messages/attachments/<message_id>/ after Django
# checks participation. Never alias CHAT_PRIVATE_ROOT or publish it to a bucket.
# If MEDIA_URL is customized, change this prefix to match it.
location ^~ /media/chat_files/ {
    return 404;
}
